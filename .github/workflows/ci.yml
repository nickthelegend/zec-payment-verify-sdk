# Runs the same `pnpm test` as locally: the Rust core (rule tests + live testnet tests) and every
# package against Zcash testnet (testnet.zec.rocks) and Avalanche Fuji (public RPC). No mocks.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Rust toolchain (pinned in packages/core/rust-toolchain.toml)
        working-directory: packages/core
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # The core verifies Sapling proofs with the published parameters (zpay-verify checks their BLAKE2b hashes).
      - name: Sapling parameters
        run: |
          mkdir -p ~/.zcash-params
          for f in sapling-spend.params sapling-output.params; do curl -fsSL --retry 3 -o ~/.zcash-params/$f https://download.z.cash/downloads/$f; done
      - run: pnpm install --frozen-lockfile
      # kage-client.test.ts runs Shielded x402's own client (packages/x402-zcash) against the paywall.
      - name: Shielded x402 (Kage) checkout for the client test
        run: git clone --depth 1 https://github.com/nickthelegend/zec-shielded-x402 "$RUNNER_TEMP/zec-shielded-x402"
      - run: pnpm test
        env:
          KAGE_X402_DIR: ${{ runner.temp }}/zec-shielded-x402/packages/x402-zcash
